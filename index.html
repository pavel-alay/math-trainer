<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)">
<title>Math Trainer</title>
<style>
/* all sizes are in rem; the root size follows the viewport so the whole UI scales */
html { font-size: clamp(11px, min(2vw, 2.15dvh), 19px); }
:root {
  color-scheme: light dark;
  --bg: #f4f1ea; --card: #ffffff; --ink: #2b2d42; --muted: #8d8f9f; --line: #e6e1d6; --soft: #f6f3ec;
  --accent: #3a6df0; --accent-deep: #2a52b8; --accent-soft: #dde6ff; --on-accent: #ffffff;
  --good: #1f9d74; --bad: #e5484d; --gold: #f5a524;
  --seg-bg: #ebe6da; --seg-ink: #5c5f73; --seg-on: #ffffff;
  --track: #e4dfd2; --knob-off: #d9d4c7; --key-shadow: #ddd6c6;
  --cell-ink: #b3b0a6; --ans-empty: #cfcabd;
  --disabled: #b9bdcc; --disabled-deep: #9a9eae; --input-focus: #ffffff;
  --new-bg: #fff3d6; --new-ink: #a86a00; --card-shadow: rgba(60,50,20,.06);
  --h-ok: #cdeedf; --h-best: #4fbf8a; --h-slow: #fbd88c; --h-bad: #f6a5a7;
  --pad: 1rem;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16181d; --card: #23262e; --ink: #eceef3; --muted: #8e93a3; --line: #353945; --soft: #2b2f38;
    --accent: #5b84f5; --accent-deep: #3a5bc0; --accent-soft: #2b3658; --on-accent: #ffffff;
    --good: #34c08f; --bad: #ff6b6f; --gold: #f5b03a;
    --seg-bg: #1c1f26; --seg-ink: #a3a8b8; --seg-on: #353a46;
    --track: #2f333d; --knob-off: #444955; --key-shadow: #111317;
    --cell-ink: #6c7180; --ans-empty: #4a4f5c;
    --disabled: #4a4f5c; --disabled-deep: #343842; --input-focus: #2f333d;
    --new-bg: #3a2f15; --new-ink: #f5c56a; --card-shadow: rgba(0,0,0,.3);
    --h-ok: #1d4a3a; --h-best: #2a8059; --h-slow: #6b5320; --h-bad: #7a2d31;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, sans-serif;
  -webkit-user-select: none; user-select: none; touch-action: manipulation;
  overscroll-behavior: none; -webkit-text-size-adjust: 100%;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
input { font: inherit; -webkit-user-select: text; user-select: text; }
h1, h2, p { margin: 0; }
[hidden] { display: none !important; }

.screen {
  display: none; min-height: 100dvh;
  padding: max(var(--pad), env(safe-area-inset-top)) max(var(--pad), env(safe-area-inset-right)) max(var(--pad), env(safe-area-inset-bottom)) max(var(--pad), env(safe-area-inset-left));
}
.screen.on { display: flex; flex-direction: column; gap: 1rem; }

/* ---------- shared controls ---------- */
.seg { display: inline-flex; flex-wrap: wrap; gap: .25rem; padding: .25rem; background: var(--seg-bg); border-radius: .9rem; }
.seg button { padding: .5rem .6rem; white-space: nowrap; border-radius: .65rem; font-size: 1rem; font-weight: 600; color: var(--seg-ink); min-height: 2.6rem; }
.seg button.on { background: var(--seg-on); color: var(--accent); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.seg.big button { font-size: 1.2rem; padding: .65rem 1.3rem; }
.chips { display: flex; flex-wrap: wrap; gap: .5rem; }
.chips button { padding: .5rem .85rem; border-radius: 999px; background: var(--soft); border: 1.5px solid var(--line); font-size: .95rem; font-weight: 600; min-height: 2.5rem; }
.chips button:active { background: var(--accent-soft); }
.card { background: var(--card); border-radius: 1.35rem; padding: 1.15rem; box-shadow: 0 2px 10px var(--card-shadow); display: flex; flex-direction: column; gap: .85rem; min-width: 0; min-height: 0; }
.card h2 { font-size: 1.1rem; font-weight: 700; }
.hint { font-size: .85rem; color: var(--muted); }
.field { display: flex; flex-direction: column; gap: .45rem; }
.field.inline { flex-direction: row; flex-wrap: wrap; align-items: center; column-gap: .8rem; }
.summary { font-size: 1.05rem; font-weight: 600; }
.summary.warn { color: var(--bad); }
.toggle { display: flex; align-items: center; gap: .75rem; font-size: 1.05rem; font-weight: 600; min-height: 2.6rem; }
.toggle input { display: none; }
.toggle .knob { width: 3.2rem; height: 2rem; border-radius: 1rem; background: var(--knob-off); position: relative; transition: background .2s; flex: none; }
.toggle .knob::after { content: ""; position: absolute; top: .2rem; left: .2rem; width: 1.6rem; height: 1.6rem; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .2s; }
.toggle input:checked + .knob { background: var(--good); }
.toggle input:checked + .knob::after { transform: translateX(1.2rem); }

/* ---------- setup ---------- */
.top { display: flex; align-items: center; justify-content: space-between; gap: .75rem; }
.top h1 { font-size: 1.75rem; font-weight: 800; white-space: nowrap; }
.top-r { display: flex; align-items: center; gap: .75rem; }
.top .seg { flex-wrap: nowrap; }
/* phones: tabs and languages share one row, sized by the screen width */
@media (max-width: 599px) {
  .top-r { flex: 1; justify-content: space-between; gap: 2vw; }
  .seg.big button { font-size: 3.4vw; padding: .5rem 1.6vw; }
  #langSeg button { font-size: 3.2vw; padding: .5rem 1.4vw; }
}
.setup-body { flex: 1; min-height: 0; display: grid; gap: 1rem; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
#addCfg { align-self: start; }
.stats-view {
  grid-column: 1 / -1; align-self: start; display: grid; gap: 1rem; align-items: start;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 22rem), 1fr));
}
/* how much of the table is green, per size */
.know { display: flex; align-items: center; gap: .75rem; font-size: 1.1rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.know span { width: 3.2rem; color: var(--muted); }
.know b { width: 3.5rem; text-align: right; }
.know .bar { flex: 1; height: .9rem; border-radius: .45rem; background: var(--soft); overflow: hidden; }
.know .bar i { display: block; height: 100%; border-radius: inherit; }
#addOpSeg { align-self: flex-start; }
.side .record { font-size: 1rem; color: var(--muted); }
.side .record b { color: var(--ink); }
@media (orientation: landscape) and (min-width: 800px) {
  .setup-body { grid-template-columns: minmax(0, 1fr) 25rem; grid-template-rows: minmax(0, 1fr); }
  .side { align-self: start; }
}
@media (orientation: portrait) and (min-width: 600px) {
  .side { display: grid; grid-template-columns: 1fr 1fr; align-items: center; }
}

/* the table takes whatever space is left: square, as big as the box allows */
.mul-body { flex: 1; min-height: 0; display: flex; gap: .85rem; }
.gridbox { flex: 1; min-width: 0; min-height: min(22rem, 62vw); container-type: size; display: flex; align-items: flex-start; justify-content: flex-start; }
.mul-side { width: 12rem; flex: none; display: flex; flex-direction: column; gap: .85rem; }
/* phones: presets stay beside the table as a single column */
@media (max-width: 599px) {
  .mul-side { width: auto; max-width: 7.5rem; }
  .mul-side .chips { flex-direction: column; align-items: stretch; }
}
.grid {
  display: grid; grid-template-columns: repeat(var(--n, 13), 1fr); grid-template-rows: repeat(var(--n, 13), 1fr); gap: 2px;
  width: min(100cqw, 100cqh); height: min(100cqw, 100cqh); touch-action: none;
}
.grid div {
  display: flex; align-items: center; justify-content: center; border-radius: .35rem; min-width: 0;
  background: var(--soft); color: var(--cell-ink); font-size: calc(min(2.6cqw, 2.6cqh) * 13 / var(--n, 13)); font-variant-numeric: tabular-nums;
}
.grid .hd { background: none; color: var(--ink); font-weight: 800; font-size: calc(min(3.3cqw, 3.3cqh) * 13 / var(--n, 13)); }
.grid .hd.on { color: var(--accent); }
.grid .corner { color: var(--muted); }
.grid { position: relative; }
/* setup table: cells keep their knowledge colours, the chosen zone gets a frame, the rest fades */
.grid .zone { position: absolute; inset: -3px; border: 3px solid var(--accent); border-radius: .55rem; pointer-events: none; }
.grid .off { opacity: .35; }
.grid .pending { opacity: 1; box-shadow: inset 0 0 0 3px var(--gold); animation: pulse 1s infinite alternate; }
@keyframes pulse { to { box-shadow: inset 0 0 0 3px rgba(245,165,36,.25); } }

.add-cols { display: grid; gap: .85rem 1.5rem; grid-template-columns: repeat(auto-fit, minmax(19rem, 1fr)); }
.add-cols > div { display: flex; flex-direction: column; gap: .85rem; }
.range-row { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; font-size: 1.05rem; }
.range-row .lbl { min-width: 4.6rem; font-weight: 700; }
.range-row input {
  width: 5.5rem; padding: .55rem .7rem; font-size: 1.35rem; font-weight: 700; text-align: center;
  border: 2px solid var(--line); border-radius: .75rem; background: var(--soft); color: var(--ink);
}
.range-row input:focus { outline: none; border-color: var(--accent); background: var(--input-focus); }
.range-row input::-webkit-inner-spin-button { -webkit-appearance: none; }

.start {
  padding: 1.1rem; border-radius: 1.1rem; background: var(--accent); color: var(--on-accent);
  font-size: 1.6rem; font-weight: 800; box-shadow: 0 .3rem 0 var(--accent-deep);
}
.start:active { transform: translateY(.2rem); box-shadow: 0 .1rem 0 var(--accent-deep); }
.start:disabled { background: var(--disabled); box-shadow: 0 .3rem 0 var(--disabled-deep); }

/* ---------- game ---------- */
.gtop { display: flex; align-items: center; gap: .9rem; position: relative; z-index: 6; }
/* pause after two problems in a row with no answer: covers the game, Stop stays on top */
.pause {
  position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.5rem;
  background: color-mix(in oklab, var(--bg) 92%, transparent);
}
.pause h2 { font-size: 2.6rem; font-weight: 800; }
.pause .btns { width: min(90vw, 34rem); }
#stopBtn { color: var(--bad); background: color-mix(in oklab, var(--bad) 14%, var(--card)); }
.ghost { padding: .6rem 1rem; border-radius: .75rem; background: var(--card); font-size: 1.05rem; font-weight: 700; color: var(--muted); min-height: 2.6rem; }
.track { flex: 1; height: .9rem; border-radius: .45rem; background: var(--track); overflow: hidden; }
.track > div { height: 100%; width: 0; background: var(--good); border-radius: .45rem; transition: width .25s; }
.gstat { font-size: 1.25rem; font-weight: 800; font-variant-numeric: tabular-nums; min-width: 4rem; text-align: right; }
.rep { padding: .4rem 1rem; border-radius: 999px; background: var(--bad); color: var(--on-accent); font-size: 1.2rem; font-weight: 800; white-space: nowrap; animation: pop .35s; }
.gstat.small { font-size: 1.05rem; color: var(--muted); font-weight: 700; }
.gmain { flex: 1; display: grid; gap: 1.25rem; grid-template-columns: minmax(0, 1fr); align-content: start; align-items: start; padding-top: 1rem; }
@media (orientation: landscape) and (min-width: 600px) {
  .gmain { grid-template-columns: minmax(0, 1fr) minmax(16rem, 23rem); }
}
.qwrap { display: flex; flex-direction: column; align-items: center; gap: 1.4rem; min-width: 0; width: 100%; }
.problem {
  display: flex; align-items: center; gap: .3em; flex-wrap: nowrap;
  font-size: 6.5rem; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap;
}
/* "=" stays in place: both sides are as wide as the longest problem of the run */
#pText { text-align: right; }
.ans-slot { display: flex; }
.ans { padding: 0 .15em; text-align: center; border-bottom: .07em solid var(--accent); color: var(--accent); }
.ans.empty { color: var(--ans-empty); }
.ans.ok { color: var(--good); border-color: var(--good); animation: pop .25s; }
.ans.reveal { color: var(--good); border-color: var(--good); }
.ans.bad { color: var(--bad); border-color: var(--bad); text-decoration: line-through; animation: shake .35s; }
@keyframes pop { 50% { transform: scale(1.15); } }
@keyframes shake { 20%, 60% { transform: translateX(-.6rem); } 40%, 80% { transform: translateX(.6rem); } }
.fb { font-size: 1.9rem; font-weight: 700; min-height: 1.3em; color: var(--bad); text-align: center; }
.fb.good { color: var(--good); }
.qbar { width: min(100%, 32rem); height: .75rem; border-radius: .4rem; background: var(--track); overflow: hidden; }
.qbar > div { height: 100%; width: 100%; background: var(--gold); transform-origin: left; }
.qbar.reveal > div { background: var(--good); animation: drain 3s linear forwards; }
@keyframes drain { from { transform: scaleX(1); } to { transform: scaleX(0); } }
.problem.reveal { color: var(--good); }
.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: .75rem; width: min(100%, 26rem); justify-self: center; }
.pad button {
  height: clamp(3.6rem, 12dvh, 5.75rem); border-radius: 1.25rem; background: var(--card); font-size: 2.25rem; font-weight: 800;
  box-shadow: 0 .25rem 0 var(--key-shadow);
}
.pad button:active { transform: translateY(.2rem); box-shadow: 0 .05rem 0 var(--key-shadow); background: var(--accent-soft); }
.pad .del { font-size: 2.15rem; font-weight: 400; }
/* phones: a slightly bigger keypad, still not the full width, at the bottom under the thumbs */
@media (max-width: 599px) and (orientation: portrait) {
  .gmain { grid-template-rows: auto minmax(0, 1fr); }
  .pad { width: min(100%, 30rem); align-self: end; margin-bottom: 1.5rem; }
  .pad button { height: clamp(3.6rem, 12dvh, 6.5rem); font-size: 2.5rem; }
  .pad .del { font-size: 2.4rem; }
}
/* Skip: soft yellow key left of 0; it needs a hold (it fills up), so a stray tap does nothing */
.pad .skip, .pad .skip:active {
  --fill: color-mix(in oklab, var(--gold) 45%, transparent);
  font-size: 1.35rem; color: var(--new-ink); -webkit-touch-callout: none; touch-action: none;
  background: linear-gradient(var(--fill), var(--fill)) no-repeat color-mix(in oklab, var(--gold) 16%, var(--card));
  background-size: 0 100%;
}
.pad .skip.holding { animation: hold .3s linear forwards; }
@keyframes hold { to { background-size: 100% 100%; } }

/* ---------- results ---------- */
.res { width: min(100%, 54rem); margin: 0 auto; display: flex; flex-direction: column; gap: 1rem; }
.res h1 { font-size: 2.1rem; font-weight: 800; text-align: center; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: .75rem; }
.tile { background: var(--card); border-radius: 1.1rem; padding: 1rem .5rem; text-align: center; }
.tile b { display: block; font-size: 2.4rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.tile span { font-size: .95rem; color: var(--muted); font-weight: 600; }
.banner { text-align: center; font-size: 1.25rem; font-weight: 700; padding: .85rem; border-radius: 1rem; background: var(--card); }
.banner.new { background: var(--new-bg); color: var(--new-ink); font-size: 1.6rem; }
.lists { display: grid; gap: .75rem; grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); }
.list { background: var(--card); border-radius: 1.1rem; padding: 1rem; display: flex; flex-direction: column; gap: .5rem; }
.list h2 { font-size: 1.05rem; }
.list .row { display: flex; justify-content: space-between; gap: .6rem; font-size: 1.25rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.list .row s { color: var(--bad); font-weight: 600; }
.list .row em { font-style: normal; color: var(--muted); font-weight: 600; }
.list .none { color: var(--muted); font-size: 1rem; }
.btns { display: flex; gap: .75rem; justify-content: center; flex-wrap: wrap; }
/* results may scroll; Menu and Again stay pinned to the bottom */
.res .btns {
  position: sticky; bottom: 0; z-index: 1;
  padding: 1.5rem 0 max(.25rem, env(safe-area-inset-bottom));
  background: linear-gradient(transparent, var(--bg) 1.25rem);
}
/* summary for parents: last run, today, all time */
.stats table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.stats th, .stats td { padding: .45rem .3rem; text-align: right; font-size: 1.1rem; }
.stats th { font-size: .9rem; color: var(--muted); font-weight: 700; }
.stats th:first-child { text-align: left; color: var(--ink); font-size: 1.05rem; }
.stats td { font-weight: 700; border-top: 1px solid var(--line); }
.stats td:first-child { text-align: left; font-weight: 600; color: var(--muted); font-size: 1rem; }
.stats .heat { display: inline-block; padding: .1rem .45rem; margin-right: -.45rem; border-radius: .5rem; color: var(--ink); }
/* the table coloured by how well each fact is known; 6×8 and 8×6 are one fact, so only the lower half */
.map { align-items: center; }
.map h2 { align-self: flex-start; }
.mapbox { width: min(100%, 30rem); aspect-ratio: 1; container-type: size; }
.mapbox .grid { touch-action: auto; }
.grid .heat { color: var(--ink); }
.mapbox .mirror { visibility: hidden; }
.legend { display: flex; flex-wrap: wrap; justify-content: center; gap: .4rem 1rem; font-size: .95rem; font-weight: 600; color: var(--muted); }
.legend i { display: inline-block; width: .9rem; height: .9rem; border-radius: .25rem; margin-right: .35rem; vertical-align: -.1rem; background: var(--soft); }
.legend .h-ok { background: linear-gradient(90deg, var(--h-ok), var(--h-best)); } .legend .h-slow { background: var(--h-slow); } .legend .h-bad { background: var(--h-bad); }
/* two equal buttons: Home and Again */
.btns > button { flex: 1; max-width: 16rem; padding: 1.1rem; font-size: 1.6rem; font-weight: 800; }
.btns > .ghost { color: var(--ink); }
</style>
</head>
<body>

<!-- ================= SETUP ================= -->
<section id="setup" class="screen on">
  <header class="top">
    <h1 data-i18n="title"></h1>
    <div class="top-r">
      <div class="seg big" id="modeSeg">
        <button data-v="mul" data-i18n="mul"></button>
        <button data-v="add" data-i18n="add"></button>
        <button data-v="stats" data-i18n="stats"></button>
      </div>
      <div class="seg" id="langSeg">
        <button data-v="en">EN</button><button data-v="pl">PL</button><button data-v="ru">RU</button>
      </div>
    </div>
  </header>

  <div class="setup-body">
    <div class="card" id="mulCfg">
      <div class="field inline">
        <div class="seg" id="mulOpSeg"><button data-v="mul" data-i18n="opMul"></button><button data-v="div" data-i18n="opDiv"></button><button data-v="mix" data-i18n="opMix"></button></div>
        <span class="hint" data-i18n="dragHint"></span>
      </div>
      <div class="mul-body">
        <div class="gridbox"><div class="grid" id="grid"></div></div>
        <div class="mul-side">
          <p class="summary" id="mulSummary"></p>
          <div class="chips" id="mulPresets">
            <button data-p="1,5,1,5">1–5</button>
            <button data-p="1,10,1,10">1–10</button>
            <button data-p="1,12,1,12">1–12</button>
            <button data-p="1,15,1,15">1–15</button>
          </div>
        </div>
      </div>
    </div>

    <div class="card" id="addCfg">
      <div class="seg" id="addOpSeg"><button data-v="plus" data-i18n="opPlus"></button><button data-v="minus" data-i18n="opMinus"></button><button data-v="mix" data-i18n="opMix"></button></div>
      <div class="add-cols">
        <div>
          <h2 data-i18n="numbers"></h2>
          <div class="range-row"><span class="lbl" data-i18n="first"></span><span data-i18n="from"></span><input id="aMin" type="number" inputmode="numeric" pattern="[0-9]*"><span data-i18n="to"></span><input id="aMax" type="number" inputmode="numeric" pattern="[0-9]*"></div>
          <div class="range-row"><span class="lbl" data-i18n="second"></span><span data-i18n="from"></span><input id="bMin" type="number" inputmode="numeric" pattern="[0-9]*"><span data-i18n="to"></span><input id="bMax" type="number" inputmode="numeric" pattern="[0-9]*"></div>
          <div class="chips" id="addPresets">
            <button data-p="1,9,1,9" data-i18n="d1"></button>
            <button data-p="10,99,1,9" data-i18n="d21"></button>
            <button data-p="10,99,10,99" data-i18n="d2"></button>
            <button data-p="100,999,10,99" data-i18n="d32"></button>
            <button data-p="100,999,100,999" data-i18n="d3"></button>
          </div>
        </div>
        <div>
          <div class="field">
            <h2 data-i18n="carry1"></h2>
            <span class="hint">8 + 5 = 13, 13 − 5 = 8</span>
            <div class="seg" id="carry1Seg"><button data-v="any" data-i18n="any"></button><button data-v="no" data-i18n="without"></button><button data-v="yes" data-i18n="with"></button></div>
          </div>
          <div class="field" id="carry2Field">
            <h2 data-i18n="carry2"></h2>
            <span class="hint">60 + 50 = 110, 110 − 50 = 60</span>
            <div class="seg" id="carry2Seg"><button data-v="any" data-i18n="any"></button><button data-v="no" data-i18n="without"></button><button data-v="yes" data-i18n="with"></button></div>

    stop: 'Стоп', nCorrect: 'верно {n}', correct: 'Верно!', streak: 'Подряд {n}!', repeat: 'Повтор {n}',
    done: 'Готово!', timeUp: 'Время вышло!', newRecord: 'Новый рекорд! Был {v}', firstRecord: 'Первый рекорд!', recordShort: 'Рекорд: {v}',
    tCorrect: 'решено верно', tMistakes: 'ошибок', tPer: 'на пример', tTime: 'время',
    mistakes: 'Ошибки', none: 'Ни одной!', slowest: 'Дольше всего', home: 'Меню', again: 'Ещё раз',
    weak: 'Повторим: {list}',
    stLast: 'Последний', stToday: 'Сегодня', stAll: 'Всё время', hr: 'ч',
    stSolved: 'Решено', stAcc: 'Без ошибок', stPer: 'На пример', stTime: 'Время занятий',
    mapTitle: 'Твоя таблица', lgOk: 'Знаю', lgSlow: 'Медленно', lgBad: 'Ошибки', lgNew: 'Ещё не было',
    problems: { one: 'пример', few: 'примера', many: 'примеров', other: 'примера' },
  },
};
const LANGS = Object.keys(I18N);
function detectLang() {
  for (const l of navigator.languages || [navigator.language]) {
    const k = String(l).slice(0, 2).toLowerCase();
    if (LANGS.includes(k)) return k;
  }
  return 'en';
}

// ---------- storage ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};

const DEFAULTS = {
  lang: detectLang(),
  mode: 'mul',
  mul: { r1: 1, r2: 10, c1: 1, c2: 10, ops: 'mul' },
  add: { aMin: 10, aMax: 99, bMin: 1, bMax: 9, c1: 'any', c2: 'any', ops: 'plus' },
  len: 'n20',
  perQ: 0,
};
const saved = store.get('trainer.cfg', {});
const cfg = {
  ...DEFAULTS, ...saved,
  mul: { ...DEFAULTS.mul, ...(saved.mul || {}) },
  add: { ...DEFAULTS.add, ...(saved.add || {}) },
};
if (!LANGS.includes(cfg.lang)) cfg.lang = DEFAULTS.lang;
// older versions stored two on/off flags for addition and subtraction
if ('plus' in cfg.add || 'minus' in cfg.add) {
  if (!('ops' in (saved.add || {}))) cfg.add.ops = cfg.add.minus ? (cfg.add.plus ? 'mix' : 'minus') : 'plus';
  delete cfg.add.plus;
  delete cfg.add.minus;
}
delete cfg.mul.swap;
// the setup table is 10×10, 12×12 or 15×15; only the presets change it
const GRID_SIZES = [10, 12, 15];
const gridSize = n => GRID_SIZES.find(s => s >= n) || 15;
cfg.mul.size = gridSize(Math.max(cfg.mul.size || 0, cfg.mul.r2, cfg.mul.c2));
const saveCfg = () => store.set('trainer.cfg', cfg);

// ---------- helpers ----------
const t = (k, p = {}) => String(I18N[cfg.lang][k] ?? I18N.en[k] ?? k).replace(/\{(\w+)\}/g, (_, x) => p[x]);
const problems = n => { const f = I18N[cfg.lang].problems; return n + ' ' + (f[new Intl.PluralRules(cfg.lang).select(n)] || f.other); };
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = rnd(0, i); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
const fmtClock = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const fmtSec = ms => (ms / 1000).toLocaleString(cfg.lang, { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' ' + t('sec');
const span = (a, b) => a === b ? String(a) : a + '–' + b;

// ---------- addition rules ----------
function addRanges(ac) {
  return [Math.min(ac.aMin, ac.aMax), Math.max(ac.aMin, ac.aMax), Math.min(ac.bMin, ac.bMax), Math.max(ac.bMin, ac.bMax)];
}
const showTensCarry = ac => Math.max(ac.aMax, ac.aMin, ac.bMax, ac.bMin) >= 10;
const ruleOk = (rule, has) => rule === 'any' || (rule === 'yes') === has;
const digit = (n, i) => Math.floor(n / 10 ** i) % 10;
const addOps = ac => ({ plus: ['+'], minus: ['−'], mix: ['+', '−'] })[ac.ops] || ['+'];
// a + b and b + a are the same problem; for subtraction the order matters
const addKey = (a, b, op) => op === '+' ? Math.min(a, b) + '+' + Math.max(a, b) : a + '−' + b;
// carry for "+", borrow for "−"; subtraction never goes below zero
function addOk(a, b, ac, op) {
  let units, tens;
  if (op === '+') {
    units = digit(a, 0) + digit(b, 0) >= 10;
    tens = digit(a, 1) + digit(b, 1) + (units ? 1 : 0) >= 10;
  } else {
    if (a < b) return false;
    units = digit(a, 0) < digit(b, 0);
    tens = digit(a, 1) - (units ? 1 : 0) < digit(b, 1);
  }
  return ruleOk(ac.c1, units) && (!showTensCarry(ac) || ruleOk(ac.c2, tens));
}
// how many distinct problems match the rules (sampled when the space is huge)
function addCount(ac) {
  const [a1, a2, b1, b2] = addRanges(ac);
  const total = (a2 - a1 + 1) * (b2 - b1 + 1);
  let sum = 0;
  for (const op of addOps(ac)) {
    if (total <= 1e6) {
      for (let a = a1; a <= a2; a++) for (let b = b1; b <= b2; b++) {
        if (!addOk(a, b, ac, op)) continue;
        // b + a is also in range: count the pair once
        if (op === '+' && a > b && b >= a1 && b <= a2 && a >= b1 && a <= b2) continue;
        sum++;
      }
      continue;
    }
    let hit = 0;
    for (let i = 0; i < 20000; i++) if (addOk(rnd(a1, a2), rnd(b1, b2), ac, op)) hit++;
    sum += Math.round(hit / 20000 * total);
  }
  return sum;
}

// ---------- problem sources ----------
// 3×6, 6×3 and 18 ÷ 3 are the same fact
const mulKey = (a, b) => Math.min(a, b) + 'x' + Math.max(a, b);
function mulProblem(a, b, mc) {
  const op = mc.ops === 'mix' ? (Math.random() < .5 ? 'mul' : 'div') : mc.ops;
  // division uses the same fact: 6 and 7 give 42 ÷ 6 = 7
  return op === 'div'
    ? { a: a * b, b: a, op: '÷', ans: b, key: mulKey(a, b) }
    : { a, b, op: '×', ans: a * b, key: mulKey(a, b) };
}
const addProblem = (a, b, op) => ({ a, b, op, ans: op === '+' ? a + b : a - b, key: addKey(a, b, op) });
// keep one of 3×6 and 6×3
function mulPairs(mc) {
  const seen = new Set(), pairs = [];
  for (let r = mc.r1; r <= mc.r2; r++) for (let c = mc.c1; c <= mc.c2; c++) {
    const k = mulKey(r, c);
    if (seen.has(k)) continue;
    seen.add(k);
    pairs.push([r, c]);
  }
  return pairs;
}
const easyFact = ([a, b]) => a === 1 || b === 1 || a === 10 || b === 10;
// deals every fact once before any repeat; reshuffles only when the deck runs out.
// Facts with ×1 or ×10 are dealt last, so they only show up when the zone is bigger than the session;
// but while some of them are not green yet, one of those comes in every 10 problems.
// The first deck leaves out the facts in skip (weak facts that come back on their own).
function mulSource(mc, skip = new Set()) {
  const pairs = mulPairs(mc), wk = weakStore().mul || {};
  const key = ([a, b]) => mulKey(a, b);
  let learn = shuffle(pairs.filter(p => easyFact(p) && !(wk[key(p)] <= 0) && !skip.has(key(p))));
  const out = new Set([...skip, ...learn.map(key)]);
  let deck = [], last = '', first = true, dealt = 0;
  return () => {
    let pair;
    if (++dealt % 10 === 5 && learn.length) pair = learn.pop();
    else {
      if (!deck.length) {
        let fresh = first ? pairs.filter(p => !out.has(key(p))) : [];
        if (!fresh.length) { fresh = pairs; learn = []; } // a full deck has them anyway
        first = false;
        // the deck is dealt from the end: easy facts go to the front
        deck = shuffle(fresh.slice()).sort((x, y) => easyFact(y) - easyFact(x));
        const n = deck.length;
        if (n > 1 && deck[n - 1].join() === last) [deck[n - 1], deck[n - 2]] = [deck[n - 2], deck[n - 1]];
      }
      pair = deck.pop();
    }
    let [a, b] = pair;
    last = a + ',' + b;
    if (Math.random() < .5) [a, b] = [b, a];
    return mulProblem(a, b, mc);
  };
}
// random problems without repeats until every matching one has been used
function addSource(ac, skip = new Set()) {
  const [a1, a2, b1, b2] = addRanges(ac);
  const ops = addOps(ac);
  const total = addCount(ac);
  let used = new Set(skip), last = '';
  return () => {
    if (used.size >= total) used = new Set();
    let fresh = null, fallback = null;
    for (let i = 0; i < 20000 && !fresh; i++) {
      const a = rnd(a1, a2), b = rnd(b1, b2), op = ops[rnd(0, ops.length - 1)];
      if (!addOk(a, b, ac, op)) continue;
      const p = addProblem(a, b, op);
      if (!used.has(p.key)) fresh = p;
      else if (!fallback || p.key !== last) fallback = p;
    }
    const p = fresh || fallback || addProblem(a1, b1, '+');
    used.add(p.key);
    last = p.key;
    return p;
  };
}

// ---------- weak facts ----------
// Stored per mode as { key: w }. A mistake sets w to 3, a slow answer keeps it at least 1,
// a quick clean answer takes 1 off. Multiplication facts go on below 0 down to -SOLID: the map
// gets greener with every clean answer in a row. Addition has too many problems for that,
// so there a fact is forgotten at 0.
const weakStore = () => store.get('trainer.weak', {});
const SLOW = 1.5; // slower than 1.5× the run's median time
const SLOW_MIN_MS = 2000;
const SOLID = 4; // clean answers in a row after the first for the darkest green

// every way to show a fact under the current settings: 6×8 and 8×6, 7 + 45 and 45 + 7
function factForms(key) {
  if (cfg.mode === 'mul') {
    const mc = cfg.mul, [x, y] = key.split('x').map(Number);
    const inZone = (r, c) => r >= mc.r1 && r <= mc.r2 && c >= mc.c1 && c <= mc.c2;
    if (!inZone(x, y) && !inZone(y, x)) return [];
    return shuffle(x === y ? [[x, y]] : [[x, y], [y, x]]).map(([a, b]) => mulProblem(a, b, mc));
  }
  const m = /^(\d+)([+−])(\d+)$/.exec(key);
  if (!m) return [];
  const ac = cfg.add, [a1, a2, b1, b2] = addRanges(ac);
  const x = +m[1], op = m[2], y = +m[3];
  if (!addOps(ac).includes(op)) return [];
  const orders = op === '+' && x !== y ? [[x, y], [y, x]] : [[x, y]];
  return orders
    .filter(([a, b]) => a >= a1 && a <= a2 && b >= b1 && b <= b2 && addOk(a, b, ac, op))
    .map(([a, b]) => addProblem(a, b, op));
}

// weak facts that fit the current settings, weakest first: [key, w, forms]
function weakList() {
  return Object.entries(weakStore()[cfg.mode] || {})
    .map(([k, w]) => [k, w, factForms(k)])
    .filter(x => x[1] > 0 && x[2].length)
    .sort((x, y) => y[1] - x[1]);
}

// problems for the next run: one form of each weak fact, then the flipped form of facts with mistakes
function weakDeck(budget) {
  const facts = weakList().slice(0, budget);
  const first = facts.map(x => x[2][0]);
  const second = facts.filter(x => x[1] >= 2 && x[2][1]).map(x => x[2][1]);
  return [...shuffle(first), ...shuffle(second)].slice(0, budget);
}

// weak problems go into every second slot until they run out
function withWeak(next, weak) {
  let i = 0;
  return () => (i++ % 2 === 1 && weak.length) ? weak.shift() : next();
}

// times: problem → ms (all its showings). Updates the weak facts after a run.
function updateWeak(g, times) {
  const missed = new Set(g.log.filter(x => !x.ok).map(x => x.p.key));
  const ms = [...times.values()].sort((a, b) => a - b);
  const median = ms[Math.floor(ms.length / 2)] || 0;
  const slowAt = ms.length >= 5 ? Math.max(SLOW_MIN_MS, median * SLOW) : Infinity;
  const slow = new Set([...times].filter(([, v]) => v > slowAt).map(([p]) => p.key));
  const all = weakStore(), w = all[g.mode] || {};
  for (const key of new Set([...times.keys()].map(p => p.key))) {
    if (missed.has(key)) w[key] = 3;
    else if (slow.has(key)) w[key] = Math.max(w[key] || 0, 1);
    else if (w[key] > 1) w[key]--;
    else if (g.mode === 'mul') w[key] = Math.max(-SOLID, (w[key] ?? 1) - 1);
    else delete w[key];
  }
  all[g.mode] = w;
  store.set('trainer.weak', all);
}

// ---------- daily stats ----------
// per mode and local day: { solved, wrong, n (problems timed), ms (their time), dur (run time) }
const dayKey = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const emptyStat = () => ({ solved: 0, wrong: 0, n: 0, ms: 0, dur: 0 });
function addStat(a, b) { for (const k in a) a[k] += b[k] || 0; return a; }
function saveRunStat(mode, run) {
  const all = store.get('trainer.days', {}), days = all[mode] || (all[mode] = {}), day = dayKey(new Date());
  days[day] = addStat(days[day] || emptyStat(), run);
  store.set('trainer.days', all);
  store.set('trainer.lastRun', { ...store.get('trainer.lastRun', {}), [mode]: run });
}
function fmtDur(ms) {
  const m = Math.round(ms / 60000);
  if (ms < 60000) return Math.round(ms / 1000) + ' ' + t('sec');
  if (m < 60) return m + ' ' + t('min');
  return Math.floor(m / 60) + ' ' + t('hr') + ' ' + (m % 60) + ' ' + t('min');
}
// table rows: last run, today, all time
function statsRows(mode) {
  const days = store.get('trainer.days', {})[mode] || {};
  const last = store.get('trainer.lastRun', {})[mode];
  const cols = [last || emptyStat(), days[dayKey(new Date())] || emptyStat(), Object.values(days).reduce(addStat, emptyStat())];
  const row = (label, f) => `<tr><td>${t(label)}</td>${cols.map(c => `<td>${f(c)}</td>`).join('')}</tr>`;
  const pill = (v, score) => `<span class="heat" style="background:${heatColor(score)}">${v}</span>`;
  // greener: 100% without mistakes (red at 50%), 2 s per problem (red at 8 s)
  const acc = c => {
    if (!(c.solved + c.wrong)) return '—';
    const a = c.solved / (c.solved + c.wrong);
    return pill(Math.round(a * 100) + '%', (a - .5) / .5);
  };
  const per = c => c.n ? pill(fmtSec(c.ms / c.n), (8000 - c.ms / c.n) / 6000) : '—';
  return `<tr><th>${t(mode)}</th><th>${t('stLast')}</th><th>${t('stToday')}</th><th>${t('stAll')}</th></tr>` +
    row('stSolved', c => c.solved) +
    row('stAcc', acc) +
    row('stPer', per) +
    row('stTime', c => c.dur ? fmtDur(c.dur) : '—');
}

function recordKey() {

  return JSON.stringify([cfg.mode, body, cfg.len]);
}

// records used to be kept per question timer too: merge them, keeping the best one
(function mergeOldRecords() {

// (n+1)×(n+1) cells: headers in row and column 0
function buildGrid(el, n) {
  const cells = [];
  el.textContent = '';
  el.style.setProperty('--n', n + 1);
  for (let r = 0; r <= n; r++) {
    cells[r] = [];
    for (let c = 0; c <= n; c++) {
      const d = document.createElement('div');
      if (r === 0 && c === 0) { d.textContent = '×'; d.className = 'hd corner'; }
      else if (r === 0) { d.textContent = c; d.className = 'hd'; }
      else if (c === 0) { d.textContent = r; d.className = 'hd'; }
      else d.textContent = r * c;
      el.appendChild(d);
      cells[r][c] = d;
    }
  }
  return cells;
}
const grid = $('grid');
let cells = []; // rebuilt when the size changes
const zone = document.createElement('span');
zone.className = 'zone';
let pending = null; // first corner after a single tap

function cellAt(x, y) {
  const b = grid.getBoundingClientRect(), n = cfg.mul.size;
  const clamp = v => Math.min(n, Math.max(1, v));
  return { r: clamp(Math.floor((y - b.top) / b.height * (n + 1))), c: clamp(Math.floor((x - b.left) / b.width * (n + 1))) };
}
function setRect(p, q) {
  Object.assign(cfg.mul, { r1: Math.min(p.r, q.r), r2: Math.max(p.r, q.r), c1: Math.min(p.c, q.c), c2: Math.max(p.c, q.c) });
}
let drag = null;
grid.addEventListener('pointerdown', e => {
  const b = grid.getBoundingClientRect();
  const n = cfg.mul.size + 1;
  if ((e.clientX - b.left) / b.width * n < 1 || (e.clientY - b.top) / b.height * n < 1) return; // headers
  e.preventDefault();
  grid.setPointerCapture(e.pointerId);
  drag = { start: cellAt(e.clientX, e.clientY), moved: false };
});
grid.addEventListener('pointermove', e => {
  if (!drag) return;
  const cur = cellAt(e.clientX, e.clientY);
  if (cur.r === drag.start.r && cur.c === drag.start.c && !drag.moved) return;
  drag.moved = true;
  pending = null;
  setRect(drag.start, cur);
  renderGrid();
});
const endDrag = () => {
  if (!drag) return;
  if (!drag.moved) {
    if (pending) { setRect(pending, drag.start); pending = null; }
    else pending = drag.start; // the zone changes (and is saved) only after the second corner
  }
  drag = null;
  saveCfg();
  renderSetup();
};
grid.addEventListener('pointerup', endDrag);
grid.addEventListener('pointercancel', endDrag);

function renderGrid() {
  const m = cfg.mul, wk = weakStore().mul || {};
  if (cells.length !== m.size + 1) { cells = buildGrid(grid, m.size); grid.append(zone); }
  zone.style.gridArea = `${m.r1 + 1} / ${m.c1 + 1} / ${m.r2 + 2} / ${m.c2 + 2}`;
  for (let r = 1; r <= m.size; r++) for (let c = 1; c <= m.size; c++) {
    const el = cells[r][c], w = wk[mulKey(r, c)];
    el.classList.toggle('off', r < m.r1 || r > m.r2 || c < m.c1 || c > m.c2);
    el.classList.toggle('heat', w !== undefined);
    el.style.background = w === undefined ? '' : heat(w);
    el.classList.toggle('pending', !!pending && pending.r === r && pending.c === c);
  }
  for (let i = 1; i <= m.size; i++) {
    cells[i][0].classList.toggle('on', i >= m.r1 && i <= m.r2);
    cells[0][i].classList.toggle('on', i >= m.c1 && i <= m.c2);
  }
  $('mulSummary').textContent = pending
    ? t('tapSecond')
    : `${span(m.r1, m.r2)} × ${span(m.c1, m.c2)} · ${problems(mulPairs(m).length)}`;
}

// ================= GAME =================
let G = null;

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id));
  window.scrollTo(0, 0);
  if (id === 'setup') checkUpdate();
}

function startGame() {
  const timed = cfg.len[0] === 't';
  const amount = +cfg.len.slice(1);
  // weak facts take up to 40% of a counted run, or one per 10 seconds of a timed one
  const weak = weakDeck(timed ? amount / 10 : Math.round(amount * .4));
  const skip = new Set(weak.map(p => p.key));
  const src = cfg.mode === 'mul' ? mulSource(cfg.mul, skip) : addSource(cfg.add, skip);
  G = {
    timed, n: timed ? 0 : amount, limitMs: timed ? amount * 1000 : 0, perQ: cfg.perQ * 1000,
    next: withWeak(src, weak), mode: cfg.mode,
    queue: [], done: 0, correct: 0, wrong: 0, streak: 0, log: [],
    input: '', cur: null, missed: null, lock: false, idle: 0, pausedAt: 0, lastAct: 0, t0: performance.now(), q0: 0, shown: 0, raf: 0, timer: 0, key: recordKey(),
  };
  for (let i = 0; i < G.n; i++) G.queue.push(G.next());
  $('pauseBox').hidden = true;
  show('game');
  fitProblem();
  nextQ();
  G.raf = requestAnimationFrame(tick);
}

function nextQ() {
  if (!G) return;
  if (!G.timed && !G.queue.length) return finish();
  if (!G.queue.length) G.queue.push(G.next());
  G.cur = G.queue.shift();
  G.input = '';
  G.lock = false;
  G.missed = null;
  G.q0 = G.shown = G.lastAct = performance.now(); // q0 restarts on retry, shown does not
  showProblem(G.cur);
  $('fb').textContent = '';
  $('fb').className = 'fb';
  // the bar is the per-question timer; without a limit it only shows up for a reveal
  $('qbar').hidden = !G.perQ;
  $('qbar').classList.remove('reveal');
  $('repBadge').hidden = !G.cur.tries;
  $('repBadge').textContent = '↻ ' + t('repeat', { n: G.cur.tries });
  document.querySelector('.problem').classList.remove('reveal');
  renderAns('');
  renderProgress();
}

function showProblem(p) {
  $('pText').textContent = `${p.a} ${p.op} ${p.b}`;
  $('ansBox').style.minWidth = (String(p.ans).length * .62 + .3) + 'em';
}

// the longest problem the current settings can give, as 8s
function widestProblem() {
  const d = n => String(n).length, forms = [];
  if (cfg.mode === 'mul') {
    const m = cfg.mul, f = d(Math.max(m.r2, m.c2)), p = d(m.r2 * m.c2);
    if (m.ops !== 'div') forms.push([f, '×', f, p]);
    if (m.ops !== 'mul') forms.push([p, '÷', f, f]);
  } else {
    const [, a2, , b2] = addRanges(cfg.add);
    for (const op of addOps(cfg.add)) forms.push([d(a2), op, d(b2), d(op === '+' ? a2 + b2 : a2)]);
  }
  const [a, op, b, ans] = forms.reduce((x, y) => [Math.max(x[0], y[0]), x[1], Math.max(x[2], y[2]), Math.max(x[3], y[3])]);
  return { a: '8'.repeat(a), op, b: '8'.repeat(b), ans: '8'.repeat(ans) };
}

// one font size and layout for the whole run, so the problem does not jump between short and long examples:
// shrink it until the longest possible problem (987 + 876) fits the screen
function fitProblem() {
  const el = document.querySelector('.problem'), left = $('pText'), slot = $('ansSlot');
  el.style.fontSize = left.style.minWidth = slot.style.minWidth = '';
  showProblem(widestProblem());
  const avail = el.parentElement.clientWidth, need = el.scrollWidth;
  if (need > avail) el.style.fontSize = Math.floor(parseFloat(getComputedStyle(el).fontSize) * avail / need) + 'px';
  // and keep the sides that wide, so short problems do not shift left and right
  left.style.minWidth = Math.ceil(left.getBoundingClientRect().width) + 'px';
  slot.style.minWidth = Math.ceil($('ansBox').getBoundingClientRect().width) + 'px';
  if (G.cur) showProblem(G.cur);
}
window.addEventListener('resize', () => { if (G) fitProblem(); });

function renderAns(state) {
  const el = $('ansBox');
  el.className = 'ans ' + (state || (G.input ? '' : 'empty'));
  el.textContent = G.input || '?';
}

function renderProgress() {
  if (G.timed) {
    $('progText').textContent = t('nCorrect', { n: G.correct });
    $('progFill').style.width = '0';
    return;
  }
  $('progText').textContent = G.done + ' / ' + G.n;
  $('progFill').style.width = (G.done / G.n * 100) + '%';
}

function press(k) {
  if (!G || G.lock) return;
  G.idle = 0;
  G.lastAct = performance.now();
  if (k === 'del') G.input = G.input.slice(0, -1);
  else if (G.input.length < 6) G.input += k;
  renderAns('');
  if (G.input.length === String(G.cur.ans).length) check();
}

function check() {
  const p = G.cur, ms = performance.now() - G.shown;
  G.lock = true;
  if (+G.input !== p.ans) return miss(G.input, ms);
  renderAns('ok');
  $('fb').className = 'fb good';
  if (G.missed) {
    G.missed.ms = ms;
    requeue(p);
    $('fb').textContent = t('correct');
    renderProgress();
    G.timer = setTimeout(nextQ, 600);
    return;
  }
  G.correct++;
  G.streak++;
  G.done++;
  G.log.push({ p, ms, ok: true });
  $('fb').textContent = G.streak >= 5 ? t('streak', { n: G.streak }) : '';
  renderProgress();
  G.timer = setTimeout(nextQ, 280);
}

// first miss of a shown example counts as an error; later misses only add to its list
// (null in the list means the time ran out). ms is the whole time on the example so far.
function markMiss(given, ms) {
  G.cur.boost = (G.cur.boost || 1) * 2; // every miss doubles the time limit for this example
  if (G.missed) { G.missed.given.push(given); G.missed.ms = ms; return; }
  G.missed = { p: G.cur, ms, ok: false, given: [given] };
  G.log.push(G.missed);
  G.wrong++;
  G.streak = 0;
}

// a missed example goes to the very end of the queue and keeps coming back until solved without a miss.
// Timed mode has no end (new examples are dealt as time goes), so there it comes back after 5 new ones.
function requeue(p) {
  p.tries = (p.tries || 0) + 1;
  if (!G.timed) { G.queue.push(p); return; }
  while (G.queue.length < 5) G.queue.push(G.next());
  G.queue.splice(5, 0, p);
}

// wrong answer: first time let the child fix it with a fresh timer, second time show the answer
function miss(given, ms) {
  markMiss(given, ms);
  renderAns('bad');
  if (G.missed.given.length >= 2) {
    G.timer = setTimeout(reveal, 700);
    return;
  }
  $('qbarFill').style.transform = 'scaleX(1)';
  G.timer = setTimeout(() => {
    if (!G) return;
    G.input = '';
    G.lock = false;
    G.q0 = performance.now();
    renderAns('');
  }, 700);
}

// skip: counts as a mistake, shows the answer and sends the example to the end of the queue
function skip() {
  if (!G || G.lock) return;
  G.lock = true;
  G.idle = 0;
  markMiss(t('skipped'), performance.now() - G.shown);
  reveal();
}

// time is up. Nothing typed three times in a row: the child has probably walked away, so pause.
function timeout(ms) {
  G.lock = true;
  clearTimeout(G.timer);
  markMiss(null, ms);
  G.idle = G.input ? 0 : G.idle + 1;
  if (G.idle < 3) return reveal();
  pause();
}

// Without a question timer: no key for this long also pauses.
const IDLE_MS = 30000;

// The clocks stop while paused: on resume the run and example start times move forward by the pause.
// Continue brings back the same problem with an empty answer and a full question timer.
function pause() {
  cancelAnimationFrame(G.raf);
  G.lock = true;
  G.pausedAt = performance.now();
  $('pauseBox').hidden = false;
}
function resume() {
  if (!G || !G.pausedAt) return;
  const now = performance.now(), d = now - G.pausedAt;
  G.t0 += d;
  G.shown += d;
  G.q0 = G.lastAct = now;
  G.pausedAt = 0;
  G.idle = 0;
  G.input = '';
  G.lock = false;
  renderAns('');
  $('qbarFill').style.transform = 'scaleX(1)';
  $('pauseBox').hidden = true;
  G.raf = requestAnimationFrame(tick);
}

// show the right answer for 3 seconds and send the example to the end of the queue.
// These 3 seconds count in the total time, not in the example's own time.
function reveal() {
  if (!G) return;
  const p = G.cur;
  requeue(p);
  G.input = String(p.ans);
  renderAns('reveal');
  document.querySelector('.problem').classList.add('reveal');
  $('qbar').hidden = false;
  $('qbar').classList.add('reveal');
  renderProgress();
  G.timer = setTimeout(nextQ, 3000);
}

function tick() {
  if (!G) return;
  const now = performance.now(), el = now - G.t0;
  if (G.timed) {
    $('clock').textContent = fmtClock(G.limitMs - el + 999);
    if (el >= G.limitMs) return finish();
  } else $('clock').textContent = fmtClock(el);
  if (!G.perQ && !G.lock && now - G.lastAct > IDLE_MS) return pause();
  if (G.perQ && !G.lock) {
    const frac = Math.min(1, (now - G.q0) / (G.perQ * (G.cur.boost || 1)));
    $('qbarFill').style.transform = `scaleX(${1 - frac})`;
    if (frac >= 1) timeout(now - G.shown);
  }
  G.raf = requestAnimationFrame(tick);
}

function stopGame() {
  if (!G) return;
  cancelAnimationFrame(G.raf);
  clearTimeout(G.timer);
}

function finish() {
  stopGame();
  const g = G;
  G = null;
  const total = g.timed ? g.limitMs : performance.now() - g.t0;
  // time per example, mistakes included. An example that came back because of a mistake
  // is the same object, so its showings are summed; a fresh deal of the same fact is separate.
  const txt = p => `${p.a} ${p.op} ${p.b} = ${p.ans}`;
  const times = new Map();
  g.log.forEach(x => times.set(x.p, (times.get(x.p) || 0) + x.ms));
  const avg = times.size ? [...times.values()].reduce((s, v) => s + v, 0) / times.size : 0;
  updateWeak(g, times);
  saveRunStat(g.mode, { solved: g.correct, wrong: g.wrong, n: times.size, ms: [...times.values()].reduce((s, v) => s + v, 0), dur: total });
  $('resStats').innerHTML = statsRows(g.mode);

  // record: least time for count mode, most correct for timed mode
  const all = records();
  const prev = all[g.key];
  const value = g.timed ? g.correct : Math.round(total);
  const better = g.timed ? (g.correct > 0 && (!prev || value > prev.v)) : (!prev || value < prev.v);
  if (better) { all[g.key] = { v: value, at: Date.now() }; store.set('trainer.records', all); }

  $('resTitle').textContent = g.timed ? t('timeUp') : t('done');
  const banner = $('resBanner');
  banner.className = 'banner' + (better ? ' new' : '');
  const fmtRec = v => g.timed ? problems(v) : fmtClock(v);
  banner.textContent = better
    ? (prev ? t('newRecord', { v: fmtRec(prev.v) }) : t('firstRecord'))
    : t('recordShort', { v: fmtRec(prev.v) });

  const tiles = g.timed
    ? [[g.correct, t('tCorrect')], [g.wrong, t('tMistakes')], [avg ? fmtSec(avg) : '—', t('tPer')]]
    : [[fmtClock(total), t('tTime')], [g.wrong, t('tMistakes')], [avg ? fmtSec(avg) : '—', t('tPer')]];
  $('resTiles').innerHTML = tiles.map(([v, label]) => `<div class="tile"><b>${v}</b><span>${label}</span></div>`).join('');

  const errs = new Map();
  g.log.filter(x => !x.ok).forEach(x => {
    const k = txt(x.p);
    if (!errs.has(k)) errs.set(k, []);
    errs.get(k).push(...x.given.map(v => v ?? t('tTime')));
  });
  $('resErrors').innerHTML = `<h2>${t('mistakes')}</h2>` + (errs.size
    ? [...errs].map(([k, gs]) => `<div class="row"><span>${k}</span><s>${gs.join(', ')}</s></div>`).join('')
    : `<div class="none">${t('none')}</div>`);

  const slow = [...times].sort((a, b) => b[1] - a[1]).slice(0, 5);
  $('resSlow').innerHTML = `<h2>${t('slowest')}</h2>` + (slow.length
    ? slow.map(([p, ms]) => `<div class="row"><span>${txt(p)}</span><em>${fmtSec(ms)}</em></div>`).join('')
    : '<div class="none">—</div>');

  $('resMapCard').hidden = g.mode !== 'mul';
  if (g.mode === 'mul') $('resMapTitle').textContent = t('mapTitle') + ' · ' + pct(knownShare(renderMap($('resMap'))));
  show('result');
}

// 10, or 12 / 15 once facts that big have been practised
const practisedSize = () => gridSize(Math.max(0, ...Object.keys(weakStore().mul || {}).flatMap(k => k.split('x').map(Number))));

// share of the 1–n table that is green (known)
function knownShare(n) {
  const wk = weakStore().mul || {};
  let known = 0;
  for (let r = 1; r <= n; r++) for (let c = r; c <= n; c++) if (wk[mulKey(r, c)] <= 0) known++;
  return known / (n * (n + 1) / 2);
}
const pct = x => Math.round(x * 100) + '%';

// Lower half only (6×8 and 8×6 are one fact); each column's header sits on the step above its first cell.
// Returns the size it was drawn at.
function renderMap(el) {
  const wk = weakStore().mul || {};
  const n = practisedSize();
  const cells = buildGrid(el, n);
  for (let r = 0; r < n; r++) for (let c = r + 1; c <= n; c++) {
    const d = cells[r][c];
    if (c > r + 1) { d.className = 'mirror'; continue; }
    d.textContent = c;
    d.className = 'hd';
  }
  for (let r = 1; r <= n; r++) for (let c = 1; c <= r; c++) {
    const w = wk[mulKey(r, c)];
    if (w === undefined) continue;
    cells[r][c].className = 'heat';
    cells[r][c].style.background = heat(w);
  }
  return n;
}

// map: red (just missed) → yellow (slow) → light green (known) → green (known for a while)
const heat = w => heatColor(w > 0 ? (3 - w) * .2 : .7 + .3 * Math.min(-w / SOLID, 1));

// score 0..1 → red, yellow, light green, green
const HEAT = [[0, '--h-bad'], [.4, '--h-slow'], [.7, '--h-ok'], [1, '--h-best']];
function heatColor(score) {
  const x = Math.min(1, Math.max(0, score));
  let i = 1;
  while (i < HEAT.length - 1 && x > HEAT[i][0]) i++;
  const [a, from] = HEAT[i - 1], [b, to] = HEAT[i];
  return `color-mix(in oklab, var(${to}) ${Math.round((x - a) / (b - a) * 100)}%, var(${from}))`;
}

// ---------- input ----------
$('pad').addEventListener('pointerdown', e => {
  const b = e.target.closest('button');
  if (!b || !b.dataset.k) return;
  e.preventDefault();
  press(b.dataset.k);
});
document.addEventListener('keydown', e => {
  if (!G) return;
  if (G.pausedAt) { if (e.key === 'Enter' || e.key === ' ') resume(); }
  else if (/^[0-9]$/.test(e.key)) press(e.key);
  else if (e.key === 'Backspace') press('del');
  else if (e.key === 'Escape') quit();
});
$('startBtn').addEventListener('click', () => { if (!viaUpdate(true)) startGame(); });
$('resumeBtn').addEventListener('click', resume);
// Skip works on a hold (as long as the fill animation); a short tap does nothing
const skipBtn = $('skipBtn');
let skipTimer = 0;
const cancelSkip = () => { clearTimeout(skipTimer); skipTimer = 0; skipBtn.classList.remove('holding'); };
skipBtn.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (!G || G.lock) return;
  skipBtn.classList.add('holding');
  skipTimer = setTimeout(() => { cancelSkip(); skip(); }, 300);
});
skipBtn.addEventListener('pointerup', cancelSkip);
skipBtn.addEventListener('pointercancel', cancelSkip);
skipBtn.addEventListener('pointerleave', cancelSkip);
$('againBtn').addEventListener('click', () => { if (!viaUpdate(true)) startGame(); });
// leave the run for the menu (Stop, Escape, Menu on the pause screen)
function quit() {
  stopGame();
  G = null;
  if (!viaUpdate(false)) { show('setup'); renderSetup(); }
}
$('stopBtn').addEventListener('click', quit);
$('pauseMenuBtn').addEventListener('click', quit);
$('toSetupBtn').addEventListener('click', () => { if (!viaUpdate(false)) { show('setup'); renderSetup(); } });

// ---------- updates ----------
// The page is one file. When the published copy no longer contains this page's own style and
// script, a new version is out. The check runs in the background (never during a run) and only
// marks it; the reload happens on the next Start, Again, Menu or Stop.
// Checked at most once a minute; after a reload, not again for 5 minutes (no loops on a stale cache).
const OWN = [document.querySelector('style').textContent, document.currentScript.textContent];
let checkedAt = 0, updateReady = false;
async function checkUpdate() {
  if (G || updateReady || Date.now() - checkedAt < 60000) return;
  checkedAt = Date.now();
  if (Date.now() - store.get('trainer.reloadAt', 0) < 300000) return;
  try {
    // 'reload' skips the browser cache and refreshes it, so location.reload() gets the new copy
    const res = await fetch(location.href.split('#')[0], { cache: 'reload' });
    const text = res.ok ? await res.text() : '';
    updateReady = !!text && !OWN.every(x => text.includes(x));
  } catch (e) {}
}
// with a new version waiting, a transition reloads instead; Start and Again start the run after it
function viaUpdate(start) {
  if (!updateReady) return false;
  store.set('trainer.reloadAt', Date.now());
  if (start) store.set('trainer.autostart', Date.now());
  location.reload();
  return true;
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(); });

applyLang();
renderSetup();
if (Date.now() - store.get('trainer.autostart', 0) < 30000) {
  store.set('trainer.autostart', 0);
  startGame();
}
checkUpdate();
</script>
</body>
</html>
